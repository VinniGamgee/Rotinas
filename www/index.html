<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotina</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>✦ Rotina</h1>
      <button id="theme-toggle" aria-label="Alternar tema">◐</button>
    </header>
    <main>
      <section class="categories">
        <div class="card" data-cat="casa">
          <span class="icon">🏠</span>
          <h2>Casa</h2>
          <p>Limpeza, louça, roupa, banheiro</p>
        </div>
        <div class="card" data-cat="trabalho">
          <span class="icon">💼</span>
          <h2>Trabalho</h2>
          <p>Tarefas e compromissos</p>
        </div>
        <div class="card" data-cat="lazer">
          <span class="icon">🎮</span>
          <h2>Lazer</h2>
          <p>Hobbies e descanso</p>
        </div>
        <div class="card" data-cat="leitura">
          <span class="icon">📚</span>
          <h2>Leitura</h2>
          <p>Livros e estudos</p>
        </div>
        <div class="card" data-cat="saude">
          <span class="icon">💪</span>
          <h2>Saúde</h2>
          <p>Exercício e bem-estar</p>
        </div>
        <div class="card" data-cat="financas">
          <span class="icon">💰</span>
          <h2>Finanças</h2>
          <p>Contas e orçamento</p>
        </div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
